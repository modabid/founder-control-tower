name: Vercel Controlled Production Deploy

on:
  push:
    branches:
      - deploy/vercel

permissions:
  contents: read

concurrency:
  group: founder-control-tower-vercel-production
  cancel-in-progress: false

jobs:
  validate-stage-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.FCT_VERCEL_TOKEN }}
      FCT_APPS_SCRIPT_READ_TOKEN: ${{ secrets.FCT_APPS_SCRIPT_READ_TOKEN }}
      FCT_WEB_ACCESS_TOKEN: ${{ secrets.FCT_WEB_ACCESS_TOKEN }}
      VERCEL_PROJECT: founder-control-tower
      VERCEL_CLI_VERSION: 59.15.1

    steps:
      - name: Checkout founder-approved source
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic regression suite
        run: npm test

      - name: Validate production secrets and read bridge registry
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN FCT_APPS_SCRIPT_READ_TOKEN FCT_WEB_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret for $name is not configured."
              echo "Deployment stopped before changing Vercel production."
              exit 1
            fi
          done
          case "$VERCEL_TOKEN" in
            vcp_*) ;;
            *)
              echo "FCT_VERCEL_TOKEN is not a Vercel-issued account token (expected vcp_ prefix)."
              echo "Do not use FCT_WEB_ACCESS_TOKEN or another randomly generated value here."
              exit 1
              ;;
          esac
          case "$VERCEL_TOKEN" in
            *[[:space:]]*)
              echo "FCT_VERCEL_TOKEN contains whitespace. Copy the exact token value without spaces or line breaks."
              exit 1
              ;;
          esac
          if [ "${#FCT_APPS_SCRIPT_READ_TOKEN}" -lt 32 ]; then
            echo "FCT_APPS_SCRIPT_READ_TOKEN must be at least 32 characters."
            exit 1
          fi
          if [ "${#FCT_WEB_ACCESS_TOKEN}" -lt 24 ]; then
            echo "FCT_WEB_ACCESS_TOKEN must be at least 24 characters."
            exit 1
          fi

          BRIDGE_URL="$(jq -r '.deploymentUrl // ""' config/apps-script-read-bridge.json)"
          case "$BRIDGE_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "Apps Script read bridge deployment URL is not registered."; exit 1 ;;
          esac
          echo "FCT_APPS_SCRIPT_READ_URL=$BRIDGE_URL" >> "$GITHUB_ENV"

      - name: Resolve dedicated Founder Control Tower project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_RESPONSE="$RUNNER_TEMP/vercel-project.json"
          PROJECT_STATUS="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$PROJECT_RESPONSE" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Accept: application/json' "https://api.vercel.com/v9/projects/$VERCEL_PROJECT")"
          if [ "$PROJECT_STATUS" != "200" ]; then
            echo "Vercel project API returned HTTP $PROJECT_STATUS. Response content was not logged."
            exit 1
          fi

          LINKED_PROJECT="$(jq -er '.name' "$PROJECT_RESPONSE")"
          PROJECT_ID="$(jq -er '.id' "$PROJECT_RESPONSE")"
          ORG_ID="$(jq -er '.accountId' "$PROJECT_RESPONSE")"
          if [ "$LINKED_PROJECT" != "$VERCEL_PROJECT" ]; then
            echo "Vercel resolved an unexpected project. Deployment stopped."
            exit 1
          fi
          case "$PROJECT_ID" in prj_*) ;; *) echo "Vercel returned an invalid project ID."; exit 1 ;; esac
          if [ -z "$ORG_ID" ]; then
            echo "Vercel returned an empty account ID."
            exit 1
          fi

          mkdir -p .vercel
          jq -n --arg orgId "$ORG_ID" --arg projectId "$PROJECT_ID" --arg projectName "$LINKED_PROJECT" '{orgId: $orgId, projectId: $projectId, projectName: $projectName}' > .vercel/project.json
          echo "Verified the dedicated Founder Control Tower project through the Vercel API."

      - name: Create isolated candidate deployment
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(npx -y "vercel@$VERCEL_CLI_VERSION" deploy --yes --token "$VERCEL_TOKEN" --env "FCT_APPS_SCRIPT_READ_URL=$FCT_APPS_SCRIPT_READ_URL" --env "FCT_APPS_SCRIPT_READ_TOKEN=$FCT_APPS_SCRIPT_READ_TOKEN" --env "FCT_WEB_ACCESS_TOKEN=$FCT_WEB_ACCESS_TOKEN")"
          CANDIDATE_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://founder-control-tower-[A-Za-z0-9-]+\.vercel\.app' | tail -n 1)"
          if [ -z "$CANDIDATE_URL" ]; then
            echo "No trusted Founder Control Tower candidate URL was returned."
            exit 1
          fi
          echo "url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "Candidate built; production traffic is unchanged."

      - name: Verify protected candidate read-only contract
        id: verify
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_URL" in
            https://founder-control-tower-*.vercel.app) ;;
            *) echo "Refusing to send founder credentials to an unexpected host."; exit 1 ;;
          esac

          PROJECT_ID="$(jq -er '.projectId' .vercel/project.json)"
          ORG_ID="$(jq -er '.orgId' .vercel/project.json)"
          ACCOUNT_QUERY=""
          case "$ORG_ID" in team_*) ACCOUNT_QUERY="?teamId=$ORG_ID" ;; esac

          BYPASS_RESPONSE="$RUNNER_TEMP/vercel-protection-bypass.json"
          BYPASS_STATUS="$(curl --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --request PATCH --output "$BYPASS_RESPONSE" --write-out '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' --data '{}' "https://api.vercel.com/v1/projects/$PROJECT_ID/protection-bypass$ACCOUNT_QUERY")"
          echo "Vercel protection bypass API HTTP status: $BYPASS_STATUS"
          test "$BYPASS_STATUS" = "200"
          BYPASS_TOKEN="$(jq -er '.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass") | .key' "$BYPASS_RESPONSE" | head -n 1)"
          if [ -z "$BYPASS_TOKEN" ]; then
            echo "Vercel did not return an automation protection bypass token."
            exit 1
          fi
          echo "::add-mask::$BYPASS_TOKEN"

          candidate_request() {
            local path="$1"
            shift
            curl "https://${CANDIDATE_URL#https://}$path" -H "x-vercel-protection-bypass: $BYPASS_TOKEN" "$@"
          }

          ROOT_CODE="$(candidate_request / --retry 4 --retry-delay 2 --retry-all-errors --silent --show-error --output "$RUNNER_TEMP/root.html" --write-out '%{http_code}')"
          echo "Candidate root HTTP status: $ROOT_CODE"
          test "$ROOT_CODE" = "200"
          grep -q 'Founder Control Tower' "$RUNNER_TEMP/root.html"

          UNAUTH_CODE="$(candidate_request /api/founder --silent --show-error --output "$RUNNER_TEMP/unauthorized.json" --write-out '%{http_code}')"
          echo "Candidate unauthorized API HTTP status: $UNAUTH_CODE"
          test "$UNAUTH_CODE" = "401"
          jq -e '.ok == false and .error == "UNAUTHORIZED"' "$RUNNER_TEMP/unauthorized.json" >/dev/null

          POST_CODE="$(candidate_request /api/founder --silent --show-error --request POST --output "$RUNNER_TEMP/post.json" --write-out '%{http_code}')"
          echo "Candidate POST API HTTP status: $POST_CODE"
          test "$POST_CODE" = "405"
          jq -e '.ok == false and .error == "METHOD_NOT_ALLOWED"' "$RUNNER_TEMP/post.json" >/dev/null

          AUTH_CODE="$(candidate_request /api/founder --retry 4 --retry-delay 2 --retry-all-errors --silent --show-error --dump-header "$RUNNER_TEMP/founder.headers" --output "$RUNNER_TEMP/founder.json" --write-out '%{http_code}' --header "Authorization: Bearer $FCT_WEB_ACCESS_TOKEN" --header 'Accept: application/json')"
          echo "Candidate authenticated API HTTP status: $AUTH_CODE"
          test "$AUTH_CODE" = "200"
          jq -e '.ok == true and .data.status == "SUCCESS" and .data.contractVersion == "1.0" and .data.provenance.source == "GOOGLE_SHEETS_READ_ONLY" and .data.provenance.writesMade == 0 and .data.provenance.externalActionsExecuted == 0 and .data.provenance.aiCallsMade == 0' "$RUNNER_TEMP/founder.json" >/dev/null
          grep -qi '^cache-control:.*no-store' "$RUNNER_TEMP/founder.headers"
          grep -qi '^vercel-cdn-cache-control:.*no-store' "$RUNNER_TEMP/founder.headers"

      - name: Safely classify failed candidate runtime
        if: steps.verify.outcome == 'failure'
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          PROJECT_ID="$(jq -er '.projectId' .vercel/project.json)"
          ORG_ID="$(jq -er '.orgId' .vercel/project.json)"
          DEPLOYMENT_HOST="${CANDIDATE_URL#https://}"
          METADATA_RESPONSE="$RUNNER_TEMP/vercel-deployment-metadata.json"
          METADATA_STATUS="$(curl --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --output "$METADATA_RESPONSE" --write-out '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Accept: application/json' "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?teamId=$ORG_ID")"
          echo "Vercel deployment metadata HTTP status: $METADATA_STATUS"
          if [ "$METADATA_STATUS" != "200" ]; then
            echo "Safe runtime diagnostic: METADATA_UNAVAILABLE"
            exit 0
          fi

          DEPLOYMENT_ID="$(jq -er '.id' "$METADATA_RESPONSE")"
          case "$DEPLOYMENT_ID" in dpl_*) ;; *) echo "Safe runtime diagnostic: INVALID_DEPLOYMENT_ID"; exit 0 ;; esac
          BYPASS_TOKEN="$(jq -er '.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass") | .key' "$RUNNER_TEMP/vercel-protection-bypass.json" | head -n 1)"
          echo "::add-mask::$BYPASS_TOKEN"

          LOG_RESPONSE="$RUNNER_TEMP/vercel-runtime-logs.ndjson"
          LOG_HEADERS="$RUNNER_TEMP/vercel-runtime-logs.headers"
          curl --max-time 15 --silent --show-error --dump-header "$LOG_HEADERS" --output "$LOG_RESPONSE" -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Accept: application/x-ndjson' "https://api.vercel.com/v1/projects/$PROJECT_ID/deployments/$DEPLOYMENT_ID/runtime-logs?format=lines&teamId=$ORG_ID" >/dev/null 2>&1 &
          LOG_PID="$!"
          sleep 2
          REPLAY_CODE="$(curl "$CANDIDATE_URL/api/founder" --silent --show-error --output "$RUNNER_TEMP/runtime-diagnostic-replay.json" --write-out '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS_TOKEN")"
          echo "Diagnostic API replay HTTP status: $REPLAY_CODE"
          wait "$LOG_PID" || true

          LOG_STATUS="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code + 0 }' "$LOG_HEADERS" 2>/dev/null || printf '0')"
          echo "Vercel runtime log stream HTTP status: $LOG_STATUS"
          if [ "$LOG_STATUS" != "200" ]; then
            echo "Safe runtime diagnostic: LOG_STREAM_UNAVAILABLE"
            exit 0
          fi

          RUNTIME_CLASS="$(jq -Rrs '
            split("\n") | map(select(length > 0) | fromjson?) |
            [.[].message? // empty] | join("\n") |
            if test("Unknown file extension|ERR_UNKNOWN_FILE_EXTENSION"; "i") then "TYPESCRIPT_EXTENSION"
            elif test("Cannot find module|ERR_MODULE_NOT_FOUND|Module not found"; "i") then "MODULE_RESOLUTION"
            elif test("does not provide an export"; "i") then "MODULE_EXPORT_MISMATCH"
            elif test("Cannot use import statement"; "i") then "CJS_ESM_IMPORT_MISMATCH"
            elif test("Unexpected token"; "i") then "UNEXPECTED_TOKEN"
            elif test("SyntaxError"; "i") then "SYNTAX_ERROR"
            elif test("handler.*not.*function|No exports found|invalid.*export|__vc__handler__"; "i") then "FUNCTION_ENTRYPOINT"
            elif test("process is not defined|Response is not defined|Request is not defined|ReferenceError"; "i") then "RUNTIME_GLOBAL"
            elif test("FUNCTION_INVOCATION_FAILED|Runtime exited|Task timed out|Unhandled"; "i") then "FUNCTION_INVOCATION"
            elif length == 0 then "NO_LOG_MESSAGE"
            else "UNCLASSIFIED_RUNTIME_ERROR"
            end
          ' "$LOG_RESPONSE")"
          LOG_COUNT="$(jq -Rrs 'split("\n") | map(select(length > 0) | fromjson?) | length' "$LOG_RESPONSE")"
          echo "Vercel runtime log rows: $LOG_COUNT"
          echo "Safe runtime diagnostic: $RUNTIME_CLASS"
          echo "Runtime response and log contents were not logged."

      - name: Stop before production when verification fails
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          echo "Candidate verification failed. Production promotion remains blocked."
          exit 1

      - name: Promote verified candidate to production
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          npx -y "vercel@$VERCEL_CLI_VERSION" promote "$CANDIDATE_URL" --yes --timeout 5m --token "$VERCEL_TOKEN"
          npx -y "vercel@$VERCEL_CLI_VERSION" promote status --token "$VERCEL_TOKEN"

      - name: Deployment summary
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          echo "Founder Control Tower verified candidate promoted to production."
          echo "Verified deployment: $CANDIDATE_URL"
          echo "Pre-promotion checks: founder auth, GET-only API, Apps Script live read, no-store, zero writes, zero external actions, zero request-path AI calls."
