name: One-time audited baseline import

on:
  push:
    paths:
      - '.github/workflows/import-baseline.yml'

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .import2/part-00 \
            .import2/part-01a \
            .import2/part-01b \
            .import2/part-02 \
            .import2/part-03 \
            .import2/part-04 \
            .import2/part-05a \
            .import2/part-05b \
            | base64 -d > /tmp/fct-baseline.tar.xz
          echo 'c99f7e7eb715b360e484554d290e2e46d271f55343ec28d35c8e8e69d8506458  /tmp/fct-baseline.tar.xz' | sha256sum -c -
          mkdir -p /tmp/fct-baseline
          tar -xJf /tmp/fct-baseline.tar.xz -C /tmp/fct-baseline
          test -f /tmp/fct-baseline/founder-control-tower/apps-script/orchestrator/Phase1FinalOrchestrator_v5.gs
          test -f /tmp/fct-baseline/founder-control-tower/PROJECT_STATE.md
          test -f /tmp/fct-baseline/founder-control-tower/package.json

      - name: Install clean repository baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps apps-script docs infra packages tests
          rm -f .env.example .gitignore AGENTS.md CHANGELOG.md CONTRIBUTING.md DECISIONS.md GITHUB_SETUP.md MIGRATION_CHECKLIST.md PROJECT_STATE.md README.md REPO_MANIFEST.md package.json
          cp -a /tmp/fct-baseline/founder-control-tower/. .
          rm -rf .import .import-xz .import2
          rm -f .github/workflows/import-baseline.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate baseline
        run: npm test

      - name: Commit audited baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Founder Control Tower Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: establish audited Founder Control Tower baseline'
          git push origin HEAD:main
